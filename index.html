<style>
  :root {
    --fs-small: 16.25px;
    --fs-base: 18.75px;
    --fs-title: 25px;
    --bg: #ffffff;
    --nav-bg: rgba(255,255,255,.95);
    --text: #000000;
    --text-light: #828282;
    --theme: #1b8ae4;                /* accent colour: change this to re-theme the whole site */
    --divider: rgba(0,0,0,.1);
    --year: rgba(0,0,0,.17);
    --code-bg: rgba(27,138,228,.05);
    --footer-bg: #1c1c1d;
    --footer-text: #e8e8e8;
    --zoom-bg: rgba(255,255,255,.96);
    --hl-prompt: #555555;
    --hl-builtin: #0086b3;
    --hl-self: #999999;
    --shadow: 0 2px 5px 0 rgba(0,0,0,.16), 0 2px 10px 0 rgba(0,0,0,.12);
    --show-moon: block;
    --show-sun: none;
    --nav-h: 56px;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1d; --nav-bg: rgba(28,28,29,.95); --text: #e8e8e8; --text-light: #a5a5a5;
      --theme: #2698ba; --divider: #424246; --year: #4d4d52; --code-bg: #2c3237;
      --footer-bg: #e8e8e8; --footer-text: #1c1c1d; --zoom-bg: rgba(28,28,29,.96);
      --hl-prompt: #aaaaaa; --hl-builtin: #24909d; --hl-self: #24909d;
      --show-moon: none; --show-sun: block; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1d; --nav-bg: rgba(28,28,29,.95); --text: #e8e8e8; --text-light: #a5a5a5;
    --theme: #2698ba; --divider: #424246; --year: #4d4d52; --code-bg: #2c3237;
    --footer-bg: #e8e8e8; --footer-text: #1c1c1d; --zoom-bg: rgba(28,28,29,.96);
    --hl-prompt: #aaaaaa; --hl-builtin: #24909d; --hl-self: #24909d;
    --show-moon: none; --show-sun: block; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--nav-h) + 10px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Inconsolata', Menlo, Consolas, monospace;
    font-size: var(--fs-base); font-weight: 400; line-height: 1.6; letter-spacing: .03em;
    padding-top: var(--nav-h); padding-bottom: 70px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--theme); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; }
  :focus-visible { outline: 2px solid var(--theme); outline-offset: 2px; }
  button { font: inherit; letter-spacing: inherit; }

  /* ---------------- navbar ---------------- */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--nav-bg); border-bottom: 1px solid var(--divider);
  }
  .nav-inner {
    position: relative; max-width: 1000px; height: var(--nav-h); margin: 0 auto; padding: 0 15px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { color: var(--text); font-size: 1.25rem; white-space: nowrap; }
  .brand b { font-weight: 700; }
  .brand:hover { text-decoration: none; color: var(--text); }
  .brand.is-hidden { visibility: hidden; }
  .nav-right { display: flex; align-items: center; gap: .25rem; }
  .nav-links { display: flex; align-items: center; list-style: none; margin: 0; padding: 0; }
  .nav-links a { display: block; color: var(--text); padding: .5rem .55rem; }
  .nav-links a:hover { color: var(--theme); text-decoration: none; }
  .nav-links a[aria-current="page"] { color: var(--theme); font-weight: 700; }
  .nav-links .sep { align-self: stretch; border-left: 1px solid var(--divider); margin: .5rem .3rem; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.25rem; height: 2.25rem; padding: 0; border: 0; background: none;
    color: var(--text); cursor: pointer;
  }
  .icon-btn:hover { color: var(--theme); }
  .icon-btn svg { width: 1.05rem; height: 1.05rem; }
  .i-moon { display: var(--show-moon); }
  .i-sun { display: var(--show-sun); }
  .menu-btn { display: none; flex-direction: column; }
  .menu-btn .bar {
    display: block; width: 22px; height: 2px; margin: 2px 0; border-radius: 1px;
    background: var(--text); transition: transform .2s, opacity .2s;
  }
  .menu-btn[aria-expanded="true"] .b1 { transform: translateY(6px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] .b2 { opacity: 0; }
  .menu-btn[aria-expanded="true"] .b3 { transform: translateY(-6px) rotate(-45deg); }
  @media (max-width: 575px) {
    .menu-btn { display: inline-flex; }
    .nav-links {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      flex-direction: column; align-items: flex-end; padding: .25rem 15px .75rem;
      background: var(--bg); border-bottom: 1px solid var(--divider);
    }
    .nav-links.open { display: flex; }
    .nav-links .sep { display: none; }
  }

  /* scroll progress line under the navbar */
  .progress {
    position: fixed; left: 0; right: 0; z-index: 21; height: 2px; pointer-events: none;
    top: calc(env(safe-area-inset-top, 0px) + var(--nav-h));
    background: var(--theme); transform: scaleX(0); transform-origin: 0 50%;
  }

  /* ---------------- page frame ---------------- */
  main { width: 100%; margin: 0 auto; padding: 34px 15px 2rem; }
  main.wide { max-width: 1120px; }
  main.narrow { max-width: 1000px; padding-top: 3rem; }
  .post-header h2 { font-size: 2rem; font-weight: 500; line-height: 1.2; margin: 0 0 .5rem; }
  .post-description { margin: 0 0 2rem; }

  /* ---------------- home ---------------- */
  .home { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 3.5rem; align-items: start; }
  .profile { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--nav-h) + 34px); padding: 5px 5px 20px 0; }
  @media (max-height: 780px) { .profile { position: static; } }
  .photo { position: relative; isolation: isolate; }
  .photo::before {
    content: ""; position: absolute; z-index: -1; top: -5px; left: 5px; width: 100%; bottom: -1px;
    background: var(--theme); border-radius: 3px;
  }
  .photo img {
    display: block; width: 100%; aspect-ratio: 17 / 20; object-fit: cover; object-position: center 30%;
    border-radius: .25rem; box-shadow: var(--shadow); cursor: zoom-in;
  }
  .profile-name { font-size: calc(var(--fs-title) * 1.25); line-height: 1.2; margin: 14px 0 .2rem; }
  .profile-name b { font-weight: 700; }
  .description { margin: 0; }
  .contact-info { display: flex; align-items: center; gap: 6px; margin-top: .2rem; overflow-wrap: anywhere; }
  .contact-info svg { width: .95em; height: .95em; flex: none; color: var(--text); }
  .contact-info:hover svg { animation: pulse .5s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .social { text-align: center; margin-top: 1.25rem; }
  .contact-icons { display: flex; justify-content: center; flex-wrap: wrap; gap: .75rem; }
  .contact-icons a { display: inline-flex; color: var(--text); transition: color .2s ease-in-out; }
  .contact-icons a:hover { color: var(--theme); }
  .contact-icons svg { width: 2rem; height: 2rem; }
  .contact-icons .cut { fill: var(--bg); }
  .contact-note { margin: .45rem 0 0; }

  .bio p { margin: 0 0 1rem; }
  blockquote {
    background: var(--bg); border-left: 2px solid var(--theme);
    margin: 1.5em 10px; padding: .5em 10px;
  }
  blockquote p:last-child { margin-bottom: 0; }
  blockquote p { margin: 0 0 .75rem; }
  h3.section { font-size: var(--fs-title); font-weight: 700; line-height: 1.2; margin: 3.25rem 0 1rem; }
  h3.section a { color: inherit; }
  h3.section.sub { margin: 2.25rem 0 .5rem; }
  h3.section a:hover { color: var(--theme); text-decoration: none; }

  @media (max-width: 800px) {
    .home { grid-template-columns: minmax(0, 1fr); gap: .5rem; }
    .profile { position: static; width: 100%; max-width: 300px; margin: 0 auto; }
    .profile-name { font-size: calc(var(--fs-title) * 1.1); white-space: nowrap; }
  }
  @media (max-width: 480px) {
    blockquote { margin-left: 0; margin-right: 0; }
  }

  /* ---------------- publications ---------------- */
  h2.year {
    font-size: 2rem; font-weight: 500; line-height: 1.2; color: var(--year); text-align: right;
    border-top: 1px solid var(--divider); padding-top: 1rem; margin: 2rem 0 -2rem;
  }
  .bib { list-style: none; margin: 0; padding: 0; }
  .bib > li { padding: .6rem 0; margin-bottom: 1rem; }
  .pub { display: grid; grid-template-columns: 180px minmax(0, 1fr); column-gap: 30px; align-items: start; }
  main.narrow .pub, main.narrow .talk { padding-right: 16%; }
  .preview { position: relative; }
  .preview img {
    display: block; width: 100%; border-radius: .25rem; box-shadow: var(--shadow);
    background: #fff; cursor: zoom-in;
  }
  .preview-badge {
    position: absolute; top: 4px; left: 4px; z-index: 1;
    background: var(--theme); color: #fff; text-decoration: none; cursor: default;
    font-size: var(--fs-small); font-weight: 700; line-height: 1; letter-spacing: .02em;
    padding: .28em .5rem; border-radius: .125rem; box-shadow: var(--shadow);
  }
  .pub .title { font-weight: 700; }
  .author sup { font-size: .7em; margin-left: 1px; }
  .btn.is-soon { color: var(--text-light); border: 1px dashed var(--text-light); cursor: default; }
  .btn.is-soon:hover { color: var(--text-light); border-color: var(--text-light); }
  .empty { color: var(--text-light); border-top: 1px solid var(--divider); padding-top: 1.5rem; margin-top: 2rem; }
  .author em { font-style: normal; border-bottom: 1px solid currentColor; }
  .more-authors {
    padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
    color: var(--text-light); border-bottom: 1px dashed var(--text-light);
  }
  .more-authors:hover { color: var(--text); border-bottom-color: var(--text); }
  .periodical { font-style: italic; }
  .links { display: flex; flex-wrap: wrap; column-gap: .375rem; }
  .btn {
    font-size: calc(var(--fs-small) / 1.25); text-transform: uppercase; line-height: 1.5;
    color: var(--text); background: none; border: 1px solid var(--text); border-radius: .125rem;
    padding: .2rem .8rem; margin: .375rem 0; cursor: pointer; transition: color .15s, border-color .15s;
  }
  .btn:hover, .btn[aria-expanded="true"] { color: var(--theme); border-color: var(--theme); text-decoration: none; }
  .abstract {
    max-height: 0; overflow: hidden; text-align: justify;
    border: 1px dashed transparent; transition: all .15s ease;
  }
  .abstract.open { max-height: 100em; border-color: var(--text); margin-top: .25rem; }
  .abstract p { margin: 10px; line-height: 1.4em; }

  @media (min-width: 801px) and (max-width: 1000px) {
    .home .pub { grid-template-columns: 140px minmax(0, 1fr); column-gap: 20px; }
  }
  @media (max-width: 767px) {
    h2.year { margin-bottom: .25rem; }
    main.narrow .pub, main.narrow .talk { padding-right: 0; }
  }
  @media (max-width: 575px) {
    .pub, .home .pub { grid-template-columns: 1fr; }
    .preview { max-width: 300px; margin-bottom: .8rem; }
  }

  /* ---------------- talks ---------------- */
  .talk { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); column-gap: 1.5rem; }
  .talk time { display: block; font-weight: 700; white-space: nowrap; }
  .talk .kind { display: block; color: var(--text-light); font-size: var(--fs-small); }
  .talk .title { font-weight: 700; }
  .talk .place { color: var(--text-light); }
  @media (max-width: 575px) {
    .talk { grid-template-columns: 1fr; }
    .talk .when { display: flex; gap: .75rem; align-items: baseline; }
  }

  /* ---------------- footer ---------------- */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    background: var(--footer-bg); color: var(--footer-text); font-size: .75rem;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  footer .inner { max-width: 1000px; margin: 0 auto; padding: 9px 15px 8px; }

  /* ---------------- image zoom ---------------- */
  .zoom {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: var(--zoom-bg); opacity: 0; transition: opacity .3s; cursor: zoom-out;
  }
  .zoom.show { opacity: 1; }
  .zoom img {
    max-width: 92vw; max-height: 86vh; width: auto; height: auto;
    border-radius: .25rem; box-shadow: var(--shadow); background: #fff;
    transform: scale(.92); transition: transform .3s;
  }
  .zoom.show img { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>

      <ul class="nav-links" id="navLinks"></ul>

  </div>
</nav>
<div class="progress" id="progress" aria-hidden="true"></div>

<main id="app"></main>

    links: { arxiv: "https://arxiv.org/abs/2602.18248", pdf: "https://arxiv.org/pdf/2602.18248" },
    abstract: "Deep learning-based methods have shown remarkable effectiveness in solving PDEs, largely due to their ability to enable fast simulations once trained. However, many critical applications remain constrained by the substantial computational costs of generating large-scale, high-quality datasets and training models. Inspired by studies on the structure of Green's functions for elliptic PDEs, we introduce Neural-HSS, a parameter-efficient architecture built upon the Hierarchical Semi-Separable (HSS) matrix structure that is provably data-efficient for a broad class of PDEs. We prove that it satisfies exactness properties even in very low-data regimes, and investigate its connections with other architectural primitives such as the Fourier neural operator layer and convolutional layers. We validate its data efficiency on the three-dimensional Poisson equation over a grid of two million points, and demonstrate that it learns from data arising from a broad class of PDEs in electromagnetism, fluid dynamics and biology."

  {
    year: 2026, badge: "ICLR", venue: "ICLR 2026, NeurIPS 2025 AI for Science Workshop",

    abstract: "Accuracy-cost trade-offs are a fundamental aspect of scientific computing: increasing resolution, order, or precision typically yields more accurate solutions at higher computational cost. We introduce the Recurrent-Depth Simulator (RecurrSim), an architecture-agnostic framework that enables explicit test-time control over accuracy-cost trade-offs in neural simulators without retraining or architectural redesign. By setting the number of recurrent iterations K, users can generate fast, less-accurate simulations for exploratory runs or real-time control loops, or increase K for more-accurate simulations in critical applications. RecurrSim achieves physically faithful long-horizon simulations on fluid dynamics benchmarks (Burgers, Korteweg-De Vries, Kuramoto-Sivashinsky); on 3D compressible Navier-Stokes with 262k points, a 0.8B parameter RecurrFNO outperforms 1.6B parameter baselines while using 13.5% less training memory. It also works across architectures: RecurrViT reduces error accumulation by 90% compared to standard Vision Transformers on Active Matter, and RecurrUPT matches UPT on ShapeNet-Car with 44% fewer parameters."

    links: { arxiv: "https://arxiv.org/abs/2511.14263", pdf: "https://arxiv.org/pdf/2511.14263" },
    abstract: "We investigate the fundamental task of solving linear systems, particularly those that are ill-conditioned. Existing numerical methods for ill-conditioned systems often require careful parameter tuning, preconditioning, or domain-specific expertise to ensure accuracy and stability. We propose Algebraformer, a Transformer-based architecture that learns to solve linear systems end-to-end, even in the presence of severe ill-conditioning. A novel encoding scheme represents matrix and vector inputs with O(n²) memory, supporting scalable inference. We demonstrate its effectiveness on application-driven problems, including interpolation tasks from spectral methods for boundary value problems and the acceleration of Newton's method, where Algebraformer achieves competitive accuracy with significantly lower computational overhead at test time."
  },
  {

    links: { arxiv: "https://arxiv.org/abs/2403.00720", pdf: "https://arxiv.org/pdf/2403.00720" },
    abstract: "Implicit-depth neural networks have grown as powerful alternatives to traditional networks in various applications in recent years. However, these models often lack guarantees of existence and uniqueness, raising stability, performance, and reproducibility issues. We present a new analysis of the existence and uniqueness of fixed points for implicit-depth neural networks based on the concept of subhomogeneous operators and the nonlinear Perron-Frobenius theory. Compared to previous similar analyses, our theory allows for weaker assumptions on the parameter matrices, yielding a more flexible framework for well-defined implicit networks. We illustrate the performance of the resulting subhomogeneous networks on feedforward, convolutional, and graph neural network examples."

/* ---------- placeholder pictures (used when no image path is given) ---------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const svgURI = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const PAL = ['#4c72b0', '#dd8452', '#55a868', '#c44e52', '#8172b3'];
const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r());
function lerpColor(stops, t) {
  t = Math.min(1, Math.max(0, t)) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(t)), f = t - i;
  const a = stops[i].match(/\w\w/g).map(h => parseInt(h, 16)), b = stops[i + 1].match(/\w\w/g).map(h => parseInt(h, 16));
  return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',') + ')';
}
function placeholderFigure(kind, seed) {
  const r = rng(seed * 7919 + 13);
  const axes = `<path d="M40 22V204H300" fill="none" stroke="#444" stroke-width="1.5"/>`;
  let g = '';
  if (kind === 'curves') {
    g += axes;
    for (let k = 0; k < 3; k++) {
      const rate = 2 + r() * 5, floor = 40 + k * 22 + r() * 18;
      let d = '';
      for (let x = 0; x <= 250; x += 5) {
        const y = floor + (190 - floor) * Math.exp(-rate * x / 250) + gauss(r) * 2.2;
        d += (x ? 'L' : 'M') + (46 + x) + ' ' + Math.min(200, y).toFixed(1);
      }
      g += `<path d="${d}" fill="none" stroke="${PAL[k]}" stroke-width="2.6" stroke-linejoin="round"/>`;
      g += `<rect x="228" y="${30 + k * 16}" width="18" height="3.5" fill="${PAL[k]}"/><rect x="252" y="${29 + k * 16}" width="${26 + r() * 14}" height="5" rx="2" fill="#ccc"/>`;
    }
  } else if (kind === 'scatter') {
    g += axes;
    for (let k = 0; k < 3; k++) {
      const cx = 90 + r() * 170, cy = 60 + r() * 110, sx = 14 + r() * 16, sy = 12 + r() * 14;
      for (let i = 0; i < 32; i++) {
        const x = Math.max(48, Math.min(294, cx + gauss(r) * sx)), y = Math.max(28, Math.min(198, cy + gauss(r) * sy));
        g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${PAL[k]}" fill-opacity=".75"/>`;
      }
    }
  } else if (kind === 'heatmap') {
    const cols = 24, rows = 18, cw = 280 / cols, ch = 200 / rows;
    const a = 0.2 + r() * .35, b = r() * 6, c = 0.2 + r() * .35, d = r() * 6;
    const vir = ['440154', '3b528b', '21918c', '5ec962', 'fde725'];
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const v = 0.5 + 0.28 * Math.sin(i * a + b) * Math.cos(j * c + d) + 0.2 * Math.sin((i + j) * 0.18 + b);
      g += `<rect x="${(20 + i * cw).toFixed(2)}" y="${(20 + j * ch).toFixed(2)}" width="${(cw + .4).toFixed(2)}" height="${(ch + .4).toFixed(2)}" fill="${lerpColor(vir, v)}"/>`;
    }
  } else if (kind === 'graph') {
    const pts = [];
    for (let i = 0; i < 18; i++) pts.push([36 + r() * 248, 30 + r() * 180, Math.floor(r() * 3)]);
    const seen = new Set();
    pts.forEach((p, i) => {
      pts.map((q, j) => [j, (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2]).filter(e => e[0] !== i)
        .sort((m, n) => m[1] - n[1]).slice(0, 2).forEach(([j]) => {
          const key = Math.min(i, j) + '-' + Math.max(i, j);
          if (!seen.has(key)) { seen.add(key); g += `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}" stroke="#9a9a9a" stroke-width="1.6"/>`; }
        });
    });
    pts.forEach(p => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="8" fill="${PAL[p[2]]}" stroke="#fff" stroke-width="2"/>`; });
  } else {
    g += axes;
    for (let gi = 0; gi < 4; gi++) for (let k = 0; k < 3; k++) {
      const h = 30 + r() * 140, x = 58 + gi * 60 + k * 15;
      g += `<rect x="${x}" y="${(204 - h).toFixed(1)}" width="13" height="${h.toFixed(1)}" fill="${PAL[k]}"/>`;
    }
  }
  return svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 320 240"><rect width="320" height="240" fill="#fff"/>${g}</svg>`);
}
function placeholderPhoto() {
  return svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="510" height="600" viewBox="0 0 340 400"><rect width="340" height="400" fill="#e4e6ea"/><circle cx="170" cy="150" r="66" fill="#b9bdc6"/><path d="M36 400c0-88 60-146 134-146s134 58 134 146z" fill="#b9bdc6"/></svg>`);
}
const FIG_KINDS = ['curves', 'graph', 'heatmap', 'scatter', 'bars'];

/* ---------- authors ---------- */
function splitMark(n) {                     // "Pietro Sittoni*" -> ["Pietro Sittoni", "*"]
  const m = String(n).match(/^(.*?)\s*([*†‡]+)$/);
  return m ? [m[1], m[2]] : [String(n), ''];
}
const isMe = n => { const base = splitMark(n)[0].toLowerCase(); return SITE.myNames.some(m => m.toLowerCase() === base); };
const nameHTML = n => {
  const [base, mark] = splitMark(n);
  return (isMe(base) ? `<em>${esc(base)}</em>` : esc(base)) + (mark ? `<sup>${esc(mark)}</sup>` : '');
};
function joinNames(list) {
  const h = list.map(nameHTML);
  if (h.length < 2) return h.join('');
  if (h.length === 2) return h.join(' and ');
  return h.slice(0, -1).join(', ') + ', and ' + h[h.length - 1];
}
function authorsHTML(authors) {
  const lim = SITE.maxAuthors || 0;
  if (!lim) return joinNames(authors);
  let cut = lim;
  const meIdx = authors.map(isMe).lastIndexOf(true);
  if (meIdx >= cut) cut = meIdx + 1;          // never hide your own name
  if (authors.length <= cut) return joinNames(authors);
  const rest = authors.slice(cut), n = rest.length;
  const label = `${n} more author${n > 1 ? 's' : ''}`;
  return authors.slice(0, cut).map(nameHTML).join(', ') +
    `, and <button type="button" class="more-authors" data-label="${esc(label)}" data-names="${esc(rest.join(', '))}" title="click to view ${esc(label)}">${esc(label)}</button>`;
}

/* ---------- building blocks ---------- */
function linkButtons(links) {
  return Object.entries(links || {}).filter(([, url]) => url).map(([k, url]) =>
    String(url).toLowerCase() === 'soon'
      ? `<span class="btn is-soon" title="coming soon">${esc(LINK_LABELS[k] || k)} coming soon</span>`
      : `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${esc(LINK_LABELS[k] || k)}</a>`).join('');
}
function pubItem(p) {
  const i = PUBLICATIONS.indexOf(p);
  const img = p.image ? esc(p.image) : placeholderFigure(p.figure || FIG_KINDS[i % FIG_KINDS.length], i + 1);
  const absId = `abs-${i}`;
  return `<li><div class="pub">
    <div class="preview">
      ${p.badge ? `<abbr class="preview-badge" title="${esc(p.venue)}">${esc(p.badge)}</abbr>` : ''}
      <img class="zoomable" src="${img}"${p.imageFull ? ` data-full="${esc(p.imageFull)}"` : ''} alt="Figure from “${esc(p.title)}”" loading="lazy">
    </div>
    <div>
      <div class="title">${esc(p.title)}</div>
      <div class="author">${authorsHTML(p.authors)}</div>
      <div class="periodical">${esc(p.venue)}</div>
      ${p.authors.some(a => splitMark(a)[1] === '*') ? `<div style="font-size:var(--fs-small);color:var(--text-light)">* equal contribution</div>` : ''}
      <div class="links">
        ${p.abstract ? `<button type="button" class="btn abs-btn" aria-expanded="false" aria-controls="${absId}">Abs</button>` : ''}
        ${linkButtons(p.links)}
      </div>
      ${p.abstract ? `<div class="abstract" id="${absId}"><p>${esc(p.abstract)}</p></div>` : ''}
    </div>
  </div></li>`;
}
function groupByYear(items, yearOf) {
  const groups = new Map();
  items.forEach(it => { const y = yearOf(it); if (!groups.has(y)) groups.set(y, []); groups.get(y).push(it); });
  return [...groups.entries()].sort((a, b) => b[0] - a[0]);
}
const parseDate = d => new Date(d + 'T12:00:00');
function talkItem(t) {
  const md = t.when ? esc(t.when) : parseDate(t.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `<li><div class="talk">
    <div class="when"><time datetime="${esc(t.date)}">${md}</time>${t.kind ? `<span class="kind">${esc(t.kind)}</span>` : ''}</div>
    <div>
      <div class="title">${esc(t.title)}</div>
      <div class="periodical">${esc(t.event)}</div>
      ${t.place ? `<div class="place">${esc(t.place)}</div>` : ''}
      ${t.links && Object.keys(t.links).length ? `<div class="links">${linkButtons(t.links)}</div>` : ''}
    </div>
  </div></li>`;
}

/* ---------- pages ---------- */
function pageAbout() {
  const icons = [
    SITE.email ? `<a href="mailto:${esc(SITE.email)}" aria-label="Email" title="Email">${ICONS.email}</a>` : '',
    ...Object.entries(SITE.social).filter(([, u]) => u).map(([k, u]) =>
      `<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${SOCIAL_NAMES[k] || k}" title="${SOCIAL_NAMES[k] || k}">${ICONS[k] || esc(k)}</a>`)
  ].join('');
  const tagline = [].concat(SITE.tagline || []).map(esc).join('<br>');
  const quote = (SITE.quote || []).map(p => `<p>${p}</p>`).join('');
  const selected = PUBLICATIONS.filter(p => p.selected);
  return `<div class="home">
    <aside class="profile">
      <div class="photo"><img class="zoomable" src="${SITE.photo ? esc(SITE.photo) : placeholderPhoto()}" alt="Portrait of ${esc(fullName)}"></div>
      <h1 class="profile-name"><b>${esc(SITE.firstName)}</b> <span style="font-weight:400">${esc(SITE.lastName)}</span></h1>
      ${tagline ? `<p class="description">${tagline}</p>` : ''}
      ${SITE.email ? `<div class="contact-info">${ICONS.envelope}<a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></div>` : ''}
      <div class="social">
        <div class="contact-icons">${icons}</div>
        ${SITE.note ? `<p class="contact-note">${esc(SITE.note)}</p>` : ''}
      </div>
    </aside>
    <div class="column2">
      <div class="bio">
        ${SITE.bio.map(p => `<p>${p}</p>`).join('')}
        ${quote ? `<blockquote>${quote}</blockquote>` : ''}
      </div>
      ${selected.length ? `
        <h3 class="section"><a href="#/publications">selected publications</a></h3>
        <ol class="bib">${selected.map(pubItem).join('')}</ol>` : ''}
    </div>
  </div>`;
}
function pagePublications() {
  return `<header class="post-header"><h2>publications</h2><p class="post-description">${esc(SITE.publicationsIntro)}</p></header>
    ${groupByYear(PUBLICATIONS, p => p.year).map(([y, list]) =>
      `<h2 class="year">${y}</h2><ol class="bib">${list.map(pubItem).join('')}</ol>`).join('')}`;
}
function pageTalks() {
  const sorted = [...TALKS].sort((a, b) => parseDate(b.date) - parseDate(a.date));
  const organized = (typeof ORGANIZED !== 'undefined' ? ORGANIZED : []);
  const orgHTML = organized.length ? `
    <h3 class="section sub">organized</h3>
    <ol class="bib">${organized.map(talkItem).join('')}</ol>
    <h3 class="section sub">talks</h3>` : '';
  const list = sorted.length
    ? groupByYear(sorted, t => parseDate(t.date).getFullYear()).map(([y, items]) =>
        `<h2 class="year">${y}</h2><ol class="bib">${items.map(talkItem).join('')}</ol>`).join('')
    : `<p class="empty">Talks and slides will appear here soon.</p>`;
  return `<header class="post-header"><h2>talks</h2><p class="post-description">${esc(SITE.talksIntro)}</p></header>
    ${orgHTML}${list}`;
}
const PAGES = { about: pageAbout, publications: pagePublications, talks: pageTalks };

/* ---------- navigation ---------- */
const navLinks = document.getElementById('navLinks');
const menuBtn = document.getElementById('menuBtn');
const brand = document.getElementById('brand');
brand.innerHTML = `<b>${esc(SITE.firstName)}</b> ${esc(SITE.lastName)}`;

function renderNav(current) {
  const items = [['about', '#/'], ['publications', '#/publications'], ['talks', '#/talks']];
  navLinks.innerHTML = items.map(([name, href]) =>
    `<li><a href="${href}"${name === current ? ' aria-current="page"' : ''}>${name}</a></li>`).join('') +
    (SITE.cv ? `<li class="sep" aria-hidden="true"></li><li><a href="${esc(SITE.cv)}" target="_blank" rel="noopener">cv</a></li>` : '');
}
function closeMenu() { navLinks.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', () => {
  const open = navLinks.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', String(open));
});

function render() {
  const key = location.hash.replace(/^#\/?/, '').split('/')[0] || 'about';
  const page = PAGES[key] ? key : 'about';
  app.className = page === 'about' ? 'wide' : 'narrow';
  app.innerHTML = PAGES[page]();
  renderNav(page);
  brand.classList.toggle('is-hidden', page === 'about');
  document.title = page === 'about' ? fullName : `${page} | ${fullName}`;
  closeMenu();
  window.scrollTo(0, 0);
  updateProgress();
}
window.addEventListener('hashchange', render);

/* ---------- interactions ---------- */
function typeText(el, text) {
  clearInterval(el._timer);
  if (reducedMotion) { el.textContent = text; return; }
  let k = 0;
  el._timer = setInterval(() => {
    el.textContent = text.slice(0, ++k);
    if (k >= text.length) clearInterval(el._timer);
  }, 10);
}
app.addEventListener('click', e => {
  const abs = e.target.closest('.abs-btn');
  if (abs) {
    const box = document.getElementById(abs.getAttribute('aria-controls'));
    abs.setAttribute('aria-expanded', String(box.classList.toggle('open')));
    return;
  }
  const more = e.target.closest('.more-authors');
  if (more) {
    more.removeAttribute('title');
    const showingNames = more.textContent === more.dataset.names;
    typeText(more, showingNames ? more.dataset.label : more.dataset.names);
    return;
  }
  const img = e.target.closest('img.zoomable');
  if (img) openZoom(img);
});

/* image zoom */
let zoomEl = null;
function openZoom(img) {
  closeZoom(true);
  zoomEl = document.createElement('div');
  zoomEl.className = 'zoom';
  zoomEl.setAttribute('role', 'dialog');
  zoomEl.setAttribute('aria-label', 'Enlarged image, click to close');
  const big = document.createElement('img');
  big.src = img.dataset.full || img.src; big.alt = img.alt;
  zoomEl.appendChild(big);
  zoomEl.addEventListener('click', () => closeZoom());
  document.body.appendChild(zoomEl);
  requestAnimationFrame(() => requestAnimationFrame(() => zoomEl && zoomEl.classList.add('show')));
}
function closeZoom(now) {
  if (!zoomEl) return;
  const el = zoomEl; zoomEl = null;
  if (now || reducedMotion) { el.remove(); return; }
  el.classList.remove('show');
  setTimeout(() => el.remove(), 300);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeZoom(); closeMenu(); } });

/* scroll progress */
const progress = document.getElementById('progress');
let ticking = false;
function updateProgress() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  progress.style.transform = `scaleX(${max > 0 ? Math.min(1, window.scrollY / max) : 0})`;
  ticking = false;
}
window.addEventListener('scroll', () => {
  if (zoomEl) closeZoom();
  if (!ticking) { ticking = true; requestAnimationFrame(updateProgress); }
}, { passive: true });
window.addEventListener('resize', updateProgress);

/* light / dark */
function effectiveTheme() {
  const t = root.getAttribute('data-theme');
  if (t) return t;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
});

document.getElementById('footer').innerHTML =
  `© Copyright ${new Date().getFullYear()} ${esc(fullName)}. Last updated: ${esc(SITE.lastUpdated)}.`;

render();
</script>
